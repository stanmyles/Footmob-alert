name: Alerte Football 12 + BTTS Oui vers Discord

on:
  schedule:
    # Chaque jour à 12:35 UTC.
    # France : 14:35 en été, 13:35 en hiver.
    - cron: "35 12 * * *"

  workflow_dispatch:
    inputs:
      target_date:
        description: "Date à analyser (YYYY-MM-DD). Vide = aujourd'hui + demain."
        required: false
        default: ""
        type: string

      min_score:
        description: "Score minimal pour les profils retenus. Vide = 60."
        required: false
        default: ""
        type: string

      days_ahead:
        description: "Jours après aujourd'hui. 1 = aujourd'hui + demain."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: football-12-btts
  cancel-in-progress: false

jobs:
  analyse-12-btts:
    name: Analyse 12 + BTTS Oui
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer le bot 12 + BTTS Oui
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          DAYS_AHEAD: ${{ inputs.days_ahead || '1' }}
          TARGET_DATE: ${{ inputs.target_date || '' }}

          LOOKBACK_MATCHES: "10"
          MIN_COMPARABLE_MATCHES: "5"

          MIN_SCORE: ${{ inputs.min_score || '60' }}
          MAX_CANDIDATES: "6"
          MAX_WATCHLIST: "4"

          FD_MIN_INTERVAL: "6.5"

        run: python bot_12_btts.py
