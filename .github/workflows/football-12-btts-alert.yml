name: Alerte Football 1 ou 2 + BTTS vers Discord

on:
  schedule:
    # Tous les jours à 12:35 UTC.
    # France métropolitaine :
    # - 14:35 pendant l'heure d'été (CEST)
    # - 13:35 pendant l'heure d'hiver (CET)
    - cron: "35 12 * * *"

  workflow_dispatch:
    inputs:
      target_date:
        description: "Date à analyser (YYYY-MM-DD). Vide = aujourd'hui + demain."
        required: false
        default: ""

      min_score:
        description: "Seuil d'alerte principal. Vide = 70."
        required: false
        default: ""

      days_ahead:
        description: "Jours après aujourd'hui à analyser. 1 = aujourd'hui + demain."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: football-12-btts
  cancel-in-progress: false

jobs:
  analyse-12-btts:
    name: Analyse 1 ou 2 plus BTTS
    runs-on: ubuntu-latest

    # Avec 6,5 secondes d'attente entre les appels API,
    # 25 minutes peut être insuffisant si beaucoup de matchs sont analysés.
    timeout-minutes: 55

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier les fichiers du dépôt
        run: |
          echo "=== Dossier courant ==="
          pwd
          echo "=== Fichiers du dépôt ==="
          find . -maxdepth 3 -type f | sort

      - name: Lancer le bot 1 ou 2 plus BTTS
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # Aujourd'hui et demain automatiquement.
          # Lors d'un lancement manuel, la valeur saisie dans
          # "days_ahead" remplace la valeur 1.
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '1' }}

          # Historique domicile ou extérieur par équipe.
          LOOKBACK_MATCHES: "10"

          # Le bot ignore les équipes avec trop peu de données comparables.
          MIN_COMPARABLE_MATCHES: "5"

          # Seuil des vrais candidats.
          # 70 conseillé pour démarrer.
          MIN_SCORE: ${{ github.event.inputs.min_score || '70' }}

          # Affichage Discord.
          MAX_CANDIDATES: "6"
          MAX_WATCHLIST: "3"

          # Les scores 60 à 69 sont affichés comme "à surveiller",
          # mais ne sont pas présentés comme sélection validée.
          WATCHLIST_MIN_SCORE: "60"

          # 6,5 s évite de surcharger l'API.
          FD_MIN_INTERVAL: "6.5"

          # Vide en exécution programmée.
          # Peut être saisi à la main dans Actions > Run workflow.
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}

        run: python bot_12_btts.py
