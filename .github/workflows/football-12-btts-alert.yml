name: Alerte Football 1 ou 2 + BTTS vers Discord

on:
  schedule:
    # Tous les jours à 12:35 UTC.
    # En France :
    # - 14:35 en période d'heure d'été
    # - 13:35 en période d'heure d'hiver
    - cron: "35 12 * * *"

  # Permet de lancer le bot à la main depuis GitHub > Actions.
  workflow_dispatch:
    inputs:
      target_date:
        description: "Date à analyser (YYYY-MM-DD). Vide = aujourd'hui + demain."
        required: false
        default: ""

      min_score:
        description: "Score minimal des profils retenus. Vide = 65."
        required: false
        default: ""

      days_ahead:
        description: "Nombre de jours après aujourd'hui. 1 = aujourd'hui + demain."
        required: false
        default: ""

permissions:
  contents: read

# Empêche deux analyses simultanées si une analyse est encore en cours.
concurrency:
  group: football-12-btts
  cancel-in-progress: false

jobs:
  analyse-12-btts:
    name: Analyse 1 ou 2 plus BTTS
    runs-on: ubuntu-latest

    # L'analyse peut être longue si beaucoup de matchs sont disponibles
    # et que l'API impose une attente entre chaque appel.
    timeout-minutes: 55

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier les fichiers du dépôt
        run: |
          echo "=== Dossier courant ==="
          pwd
          echo "=== Fichiers du dépôt ==="
          find . -maxdepth 3 -type f | sort

      - name: Lancer le bot 1 ou 2 plus BTTS
        env:
          # Secrets à créer dans :
          # Settings > Secrets and variables > Actions > Repository secrets
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # Période par défaut :
          # 1 = aujourd'hui + demain.
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '1' }}

          # Historique utilisé pour les statistiques comparables.
          LOOKBACK_MATCHES: "10"

          # Minimum de matchs domicile / extérieur disponibles.
          MIN_COMPARABLE_MATCHES: "5"

          # Seuil principal.
          # 65 conseillé pour obtenir plus de profils,
          # sans retenir presque tous les matchs.
          MIN_SCORE: ${{ github.event.inputs.min_score || '65' }}

          # Limites d'affichage Discord.
          MAX_CANDIDATES: "5"
          MAX_WATCHLIST: "3"

          # Délai volontaire entre deux appels à football-data.org.
          FD_MIN_INTERVAL: "6.5"

          # Utilisé seulement pour un lancement manuel.
          # Vide = aujourd'hui + demain.
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}

        run: python bot_12_btts.py
