name: Football Data Weekly Test

on:
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Nombre de jours a analyser"
        required: true
        default: "7"
      competitions:
        description: "Codes competitions separes par des virgules (ex: PL,PD,SA,BL1,FL1,UCL)"
        required: true
        default: "PL,PD,SA,BL1,FL1,UCL"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verifier les secrets
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$FOOTBALL_DATA_API_KEY" ]; then
            echo "FOOTBALL_DATA_API_KEY manquant"
            exit 1
          fi
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL manquant"
            exit 1
          fi
          echo "Secrets OK"

      - name: Lancer le bot
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead }}
          COMPETITIONS: ${{ github.event.inputs.competitions }}
        run: python bot_football.py
