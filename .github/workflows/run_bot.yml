name: Bot Football

on:
  workflow_dispatch: # Permet de lancer le bot manuellement
  schedule:
    - cron: "*/30 * * * *" # Lance le bot toutes les 30 minutes (heure UTC)

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verifier la cle RapidAPI
        run: |
          if [ -z "$RAPIDAPI_KEY" ]; then
            echo "ERREUR : le secret RAPIDAPI_KEY est absent."
            exit 1
          fi
          echo "La cle RapidAPI est bien presente."

      - name: Lancer le bot
        run: python bot_football.py
