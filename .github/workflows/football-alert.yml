name: .github/workflows/football-h2h-alerts.yml

on:
  workflow_dispatch:

  schedule:
    # Horaires UTC.
    # En septembre en France (CEST = UTC+2) :
    # 08:00 UTC = environ 10:00
    # 13:00 UTC = environ 15:00
    # 18:00 UTC = environ 20:00
    - cron: "0 8,13,18 * * *"

permissions:
  contents: read

concurrency:
  group: football-h2h-alerts
  cancel-in-progress: false

jobs:
  football-h2h:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # Réglages du bot
      DAYS_AHEAD: "2"
      MAX_MATCHES: "25"
      H2H_LIMIT: "20"
      H2H_YEARS_BACK: "3"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer l'analyse H2H
        run: python football_h2h.py

      - name: Sauvegarder les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-h2h-results
          path: output/
          if-no-files-found: warn
          retention-days: 14