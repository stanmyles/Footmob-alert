name: Football H2H Alerts

on:
  workflow_dispatch:

  schedule:
    # Heures en UTC :
    # 08:00 UTC = 09:00 France hiver / 10:00 France été
    # 13:00 UTC = 14:00 France hiver / 15:00 France été
    # 18:00 UTC = 19:00 France hiver / 20:00 France été
    - cron: "0 8,13,18 * * *"

permissions:
  contents: read

concurrency:
  group: football-h2h-alert
  cancel-in-progress: false

jobs:
  football-h2h:
    name: Analyse H2H et envoi Discord
    runs-on: ubuntu-latest

    # Suffisant pour au plus 25 appels H2H,
    # avec environ 6,5 secondes entre chaque requête.
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer le bot
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # Paramètres modifiables sans toucher au Python.
          DAYS_AHEAD: "2"
          MAX_MATCHES: "25"
          H2H_LIMIT: "10"
          H2H_YEARS_BACK: "3"
        run: python bot_football.py

      - name: Sauvegarder les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-h2h-results
          path: output/
          if-no-files-found: warn
          retention-days: 14
