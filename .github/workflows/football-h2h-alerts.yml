name: Football H2H Alerts

on:
  schedule:
    # Tous les jours à 12:00 UTC.
    # France : 14:00 en été / 13:00 en hiver.
    - cron: "0 12 * * *"

  # Permet aussi un lancement manuel dans GitHub > Actions.
  workflow_dispatch:

permissions:
  # Autorise uniquement le commit du dossier output/ à la fin.
  contents: write

jobs:
  analyse-h2h:
    name: Analyse des confrontations directes
    runs-on: ubuntu-latest

    # 70 appels H2H avec une pause de 6,5 s prennent environ 8 min.
    # 25 min laisse une marge pour les appels API initiaux et les retries.
    timeout-minutes: 25

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier les fichiers du dépôt
        run: |
          echo "=== Dossier courant ==="
          pwd
          echo "=== Fichiers du dépôt ==="
          find . -maxdepth 3 -type f | sort

      - name: Lancer l'analyse H2H et envoyer Discord
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # Recherche : aujourd'hui + les 7 jours suivants.
          DAYS_AHEAD: "7"

          # Analyse jusqu'à 70 affiches au lieu de 25 ou 50.
          MAX_MATCHES: "70"

          # Maximum d'historiques demandés par affiche.
          H2H_LIMIT: "20"

          # Ne conserve que les confrontations des trois dernières années.
          H2H_YEARS_BACK: "3"

        # Ton fichier réel est bot_football.py.
        run: python bot_football.py

      - name: Conserver les résultats en artefact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-h2h-results-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

      - name: Enregistrer les résultats dans le dépôt
        if: success()
        run: |
          if [ -z "$(git status --porcelain output/)" ]; then
            echo "Aucune modification dans output/."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/
          git commit -m "Mise à jour des alertes H2H"
          git push
