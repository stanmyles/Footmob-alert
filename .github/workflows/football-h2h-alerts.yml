name: Football H2H Alerts

on:
  schedule:
    # Tous les jours à 12:00 UTC.
    # France : 14:00 en heure d'été / 13:00 en heure d'hiver.
    - cron: "0 12 * * *"

  # Permet de lancer le script manuellement depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  # Nécessaire uniquement si tu gardes l'étape qui commit output/.
  contents: write

jobs:
  analyse-h2h:
    name: Analyse des confrontations directes
    runs-on: ubuntu-latest

    # 50 analyses H2H avec une attente de 6,5 s prend plus de 5 min.
    # On laisse une marge pour les appels aux compétitions et les retries.
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer l'analyse H2H et envoyer Discord
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # Aujourd'hui + 7 jours suivants.
          DAYS_AHEAD: "7"

          # Au lieu de seulement 25 matchs, le script peut en analyser 50.
          MAX_MATCHES: "50"

          # Jusqu'à 20 confrontations pour chaque affiche.
          H2H_LIMIT: "20"

          # Historique H2H limité aux trois dernières années.
          H2H_YEARS_BACK: "3"

        run: python football_h2h_alerts.py

      - name: Conserver les résultats en artefact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-h2h-results-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

      - name: Enregistrer les résultats dans le dépôt
        # Cette étape est facultative.
        # Elle ajoute/actualise les fichiers du dossier output/ dans GitHub.
        if: success()
        run: |
          if [ -z "$(git status --porcelain output/)" ]; then
            echo "Aucune modification dans output/."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/
          git commit -m "Mise à jour des alertes H2H"
          git push
