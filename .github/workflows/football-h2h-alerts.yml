name: Football H2H Alerts

on:
  workflow_dispatch:

  schedule:
    # Heures UTC.
    # En septembre en France (CEST, UTC+2) :
    # 08:00 UTC = 10:00
    # 13:00 UTC = 15:00
    # 18:00 UTC = 20:00
    - cron: "0 8,13,18 * * *"

permissions:
  contents: read

concurrency:
  group: football-h2h-alert
  cancel-in-progress: false

jobs:
  football-h2h:
    name: Analyse H2H et envoi Discord
    runs-on: ubuntu-latest

    # 25 analyses H2H, plus les appels de compétitions.
    # 30 min évite que GitHub coupe le job trop tôt.
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer le bot
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # Aujourd'hui + 7 jours, 25 analyses maximum.
          DAYS_AHEAD: "7"
          MAX_MATCHES: "25"

          # Jusqu'à 20 résultats H2H demandés, puis filtrage des 3 dernières années.
          H2H_LIMIT: "20"
          H2H_YEARS_BACK: "3"
        run: python bot_football.py

      - name: Sauvegarder les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-h2h-results
          path: output/
          if-no-files-found: warn
          retention-days: 14
