name: Football Analysis No Odds

on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Nombre de jours à analyser"
        required: false
        default: "3"
      max_matches:
        description: "Nombre maximal de matchs analysés"
        required: false
        default: "15"

permissions:
  contents: read

jobs:
  football-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '3' }}
      MAX_MATCHES: ${{ github.event.inputs.max_matches || '15' }}
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secret
        run: |
          if [ -z "${FOOTBALL_DATA_API_TOKEN}" ]; then
            echo "ERREUR: FOOTBALL_DATA_API_TOKEN manquant"
            exit 1
          fi
          echo "FOOTBALL_DATA_API_TOKEN: OK"

      - name: Run analysis
        run: |
          python scripts/value_bets.py

      - name: Show outputs
        if: always()
        run: |
          echo "===== output/ ====="
          ls -la output || true
          echo "===== notification_message.txt ====="
          cat output/notification_message.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-analysis-output
          path: output/
          if-no-files-found: warn
