name: Value Bets Football

on:
  schedule:
    - cron: '0 7,12,18 * * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Nombre de jours à analyser"
        required: false
        default: "2"
      bankroll:
        description: "Bankroll de référence"
        required: false
        default: "1000"

permissions:
  contents: read

jobs:
  run-value-bets:
    runs-on: ubuntu-latest

    env:
      FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '2' }}
      BANKROLL: ${{ github.event.inputs.bankroll || '1000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run value bet script
        run: |
          python scripts/value_bets.py

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: value-bets-output
          path: output/
