name: Football Value Bets

on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Nombre de jours à analyser"
        required: false
        default: "3"
      max_matches:
        description: "Nombre maximal de matchs analysés"
        required: false
        default: "25"
      bankroll:
        description: "Bankroll de référence"
        required: false
        default: "1000"
      min_edge_pct:
        description: "Edge minimum en points de probabilité"
        required: false
        default: "2"
      min_ev_pct:
        description: "EV minimum en pourcentage"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  football-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '3' }}
      MAX_MATCHES: ${{ github.event.inputs.max_matches || '25' }}
      BANKROLL: ${{ github.event.inputs.bankroll || '1000' }}
      MIN_EDGE_PCT: ${{ github.event.inputs.min_edge_pct || '2' }}
      MIN_EV_PCT: ${{ github.event.inputs.min_ev_pct || '1' }}

      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        run: |
          if [ -z "${FOOTBALL_DATA_API_TOKEN}" ]; then
            echo "ERREUR: FOOTBALL_DATA_API_TOKEN manquant"
            exit 1
          fi

          echo "FOOTBALL_DATA_API_TOKEN: OK"

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "WARNING: DISCORD_WEBHOOK_URL absent"
          else
            echo "DISCORD_WEBHOOK_URL: OK"
          fi

          if [ -z "${ODDS_API_KEY}" ]; then
            echo "WARNING: ODDS_API_KEY absent, les cotes seront ignorées"
          else
            echo "ODDS_API_KEY: OK"
          fi

      - name: Run analysis
        run: |
          python scripts/value_bets.py

      - name: Show outputs
        if: always()
        run: |
          echo "===== output/ ====="
          ls -la output || true
          echo "===== notification_message.txt ====="
          cat output/notification_message.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-analysis-output
          path: output/
          if-no-files-found: warn
