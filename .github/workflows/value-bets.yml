name: Football H2H & Value Bets

on:
  schedule:
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Nombre de jours à analyser"
        required: false
        default: "7"
      bankroll:
        description: "Bankroll de référence"
        required: false
        default: "1000"
      min_edge_pct:
        description: "Edge minimum en points de probabilité"
        required: false
        default: "2"
      min_ev_pct:
        description: "EV minimum en pourcentage"
        required: false
        default: "1"
      h2h_years:
        description: "Fenêtre H2H en années"
        required: false
        default: "2"
      max_matches:
        description: "Nombre max de matchs à traiter"
        required: false
        default: "150"

permissions:
  contents: read

jobs:
  value-bets:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '7' }}
      BANKROLL: ${{ github.event.inputs.bankroll || '1000' }}
      MIN_EDGE_PCT: ${{ github.event.inputs.min_edge_pct || '2' }}
      MIN_EV_PCT: ${{ github.event.inputs.min_ev_pct || '1' }}
      H2H_YEARS: ${{ github.event.inputs.h2h_years || '2' }}
      MAX_MATCHES: ${{ github.event.inputs.max_matches || '150' }}
      TZ: Europe/Paris

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort

      - name: Check required secret
        run: |
          if [ -z "${FOOTBALL_DATA_API_TOKEN}" ]; then
            echo "FOOTBALL_DATA_API_TOKEN absent"
            exit 1
          fi
          echo "FOOTBALL_DATA_API_TOKEN présent"

      - name: Optional test Discord webhook
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        run: |
          curl -s -o /tmp/discord_response.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"content":"Test GitHub Actions -> Discord OK"}' \
            "${DISCORD_WEBHOOK_URL}" > /tmp/discord_status.txt
          echo "Discord HTTP status: $(cat /tmp/discord_status.txt)"
          cat /tmp/discord_response.txt || true

      - name: Run analysis
        working-directory: ${{ github.workspace }}
        run: python scripts/value_bets.py

      - name: Show output files
        if: always()
        run: |
          echo "===== output/ ====="
          ls -la output || true
          echo "===== notification_message.txt ====="
          cat output/notification_message.txt || true

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-bets-output
          path: output/
