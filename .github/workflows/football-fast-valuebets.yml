name: Football Fast H2H + Value Bets

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"

  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Nombre de jours à analyser"
        required: false
        default: "5"

      max_matches:
        description: "Nombre maximum de matchs à analyser"
        required: false
        default: "15"

      h2h_limit:
        description: "Nombre maximum de confrontations H2H à analyser"
        required: false
        default: "10"

      min_h2h_matches:
        description: "Nombre minimum de confrontations H2H exploitables"
        required: false
        default: "5"

      min_h2h_wins:
        description: "Nombre minimum de victoires H2H de l'équipe dominante"
        required: false
        default: "4"

      min_h2h_gap:
        description: "Écart minimal de victoires H2H entre les deux équipes"
        required: false
        default: "2"

      min_ev_pct:
        description: "EV minimale pour afficher une value bet (%)"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '5' }}
      MAX_MATCHES: ${{ github.event.inputs.max_matches || '15' }}
      H2H_LIMIT: ${{ github.event.inputs.h2h_limit || '10' }}
      MIN_H2H_MATCHES: ${{ github.event.inputs.min_h2h_matches || '5' }}
      MIN_H2H_WINS: ${{ github.event.inputs.min_h2h_wins || '4' }}
      MIN_H2H_GAP: ${{ github.event.inputs.min_h2h_gap || '2' }}
      MIN_EV_PCT: ${{ github.event.inputs.min_ev_pct || '2' }}

      PYTHONUNBUFFERED: "1"
      TZ: Europe/Paris

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier les secrets
        run: |
          if [ -z "${FOOTBALL_DATA_API_TOKEN}" ]; then
            echo "ERREUR : FOOTBALL_DATA_API_TOKEN manquant"
            exit 1
          fi

          echo "FOOTBALL_DATA_API_TOKEN : OK"

          if [ -z "${ODDS_API_KEY}" ]; then
            echo "ATTENTION : ODDS_API_KEY absent, aucune value bet ne sera calculée."
          else
            echo "ODDS_API_KEY : OK"
          fi

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "ATTENTION : DISCORD_WEBHOOK_URL absent, aucun message Discord ne sera envoyé."
          else
            echo "DISCORD_WEBHOOK_URL : OK"
          fi

      - name: Lancer l'analyse
        run: |
          python scripts/football_fast_valuebets.py

      - name: Afficher les fichiers créés
        if: always()
        run: |
          echo "===== Dossier output ====="
          ls -la output || true

          echo "===== Message Discord ====="
          cat output/notification_message.txt || true

      - name: Sauvegarder les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-fast-valuebets-output
          path: output/
          if-no-files-found: warn
