name: Football Fast H2H + Value Bets

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Nombre de jours à analyser"
        required: false
        default: "5"
      max_matches:
        description: "Nombre max de matchs à analyser"
        required: false
        default: "15"
      h2h_limit:
        description: "Nombre de H2H à analyser"
        required: false
        default: "10"
      min_h2h_wins:
        description: "Victoires H2H minimales pour équipe dominante"
        required: false
        default: "7"
      min_ev_pct:
        description: "EV minimale (%)"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '5' }}
      MAX_MATCHES: ${{ github.event.inputs.max_matches || '15' }}
      H2H_LIMIT: ${{ github.event.inputs.h2h_limit || '10' }}
      MIN_H2H_WINS: ${{ github.event.inputs.min_h2h_wins || '7' }}
      MIN_EV_PCT: ${{ github.event.inputs.min_ev_pct || '2' }}

      PYTHONUNBUFFERED: "1"
      TZ: Europe/Paris

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        run: |
          if [ -z "${FOOTBALL_DATA_API_TOKEN}" ]; then
            echo "ERREUR: FOOTBALL_DATA_API_TOKEN manquant"
            exit 1
          fi

          echo "FOOTBALL_DATA_API_TOKEN: OK"

          if [ -z "${ODDS_API_KEY}" ]; then
            echo "WARNING: ODDS_API_KEY absent - pas de value bets"
          else
            echo "ODDS_API_KEY: OK"
          fi

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "WARNING: DISCORD_WEBHOOK_URL absent"
          else
            echo "DISCORD_WEBHOOK_URL: OK"
          fi

      - name: Run fast football analysis
        run: |
          python scripts/football_fast_valuebets.py

      - name: Show outputs
        if: always()
        run: |
          echo "===== output/ ====="
          ls -la output || true
          echo "===== notification_message.txt ====="
          cat output/notification_message.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-fast-valuebets-output
          path: output/
          if-no-files-found: warn
